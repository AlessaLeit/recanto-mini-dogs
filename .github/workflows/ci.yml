name: CI

# Valida Pull Requests antes do merge. O push direto na master e' coberto
# pelo workflow de Deploy, que roda os mesmos testes antes de publicar.
on:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi playwright pytest pytest-cov

    - name: Run unit tests
      run: pytest test/test_unitario.py
