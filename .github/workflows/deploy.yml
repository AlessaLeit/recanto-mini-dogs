name: Deploy

# Dispara a cada push na master (o merge de dev -> master e' o gatilho do
# deploy) e tambem manualmente pelo botao "Run workflow" na aba Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── 1. Testes ────────────────────────────────────────────────────────────
  # Roda antes de tudo: se falhar, nenhuma imagem e' publicada e o servidor
  # nao e' tocado.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar testes unitarios
        run: pytest test/test_unitario.py -q

  # ── 2. Build + publicacao das imagens ────────────────────────────────────
  imagens:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cada imagem recebe duas tags: 'latest' (usada pelo compose no
      # servidor) e o SHA do commit (permite identificar exatamente qual
      # versao esta no ar e voltar atras se precisar).
      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pacotesbanho-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pacotesbanho-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pacotesbanho-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pacotesbanho-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy na EC2 ─────────────────────────────────────────────────────
  deploy:
    needs: imagens
    runs-on: ubuntu-latest
    steps:
      - name: Preparar a chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # O servidor nao recebe codigo-fonte: so puxa as imagens novas do
      # Docker Hub e recria os containers. O 'prune' evita que as imagens
      # antigas encham o disco da instancia a cada deploy.
      - name: Atualizar os containers no servidor
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            cd ~/recanto-minidogs
            docker compose pull
            docker compose up -d
            docker image prune -f
          '

      - name: Verificar se a aplicacao respondeu
        run: |
          sleep 15
          curl --fail --silent --show-error --max-time 20 \
            "http://${{ secrets.EC2_HOST }}" > /dev/null
          echo "Aplicacao respondendo em http://${{ secrets.EC2_HOST }}"
