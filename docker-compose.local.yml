# Uso LOCAL no computador da usuária (sem domínio/HTTPS): acesso em http://localhost
# Iniciado pelo "Abrir Sistema.bat". Reaproveita os volumes do projeto "pacotesbanho"
# (pgdata e evolution_instances), então os dados já existentes continuam lá.
name: ${COMPOSE_PROJECT_NAME:-pacotesbanho}

services:
  postgres_local:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sem 'ports': o banco só é acessível pelos outros containers, nunca pela rede
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - petshop_network

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: petshop_evolution
    environment:
      SERVER_URL: http://evolution_api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_local:5432/${EVOLUTION_DB_NAME:-evolution}?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CORS_ORIGIN: "http://localhost"
      LOG_LEVEL: "INFO"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres_local:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - petshop_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pacotesbanho-local-backend:latest
    container_name: petshop_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_local:5432/${POSTGRES_DB}
      DEBUG: "false"
      LOG_LEVEL: "info"
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-recanto-minidogs}
    # Sem 'ports': só o frontend (nginx) fala com o backend, pela rede interna
    depends_on:
      postgres_local:
        condition: service_healthy
      evolution_api:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - petshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pacotesbanho-local-frontend:latest
    container_name: petshop_frontend
    ports:
      # Só este computador acessa (127.0.0.1): outros aparelhos da rede não entram
      - "127.0.0.1:${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - petshop_network

networks:
  petshop_network:
    driver: bridge

volumes:
  pgdata:
  evolution_instances:
