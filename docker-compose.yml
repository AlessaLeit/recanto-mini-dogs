services:
  postgres_local:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petshop_network

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: petshop_evolution
    environment:
      SERVER_URL: http://evolution_api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_local:5432/${EVOLUTION_DB_NAME:-evolution}?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CORS_ORIGIN: "*"
      LOG_LEVEL: "INFO"
    # Sem 'ports': só acessível dentro da rede interna do Docker. O backend
    # expõe o QR code / status através de endpoints autenticados (JWT) em
    # /api/v1/whatsapp/*, então não precisamos publicar a porta 8080 do
    # Evolution API na máquina/host.
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres_local:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - petshop_network

  backend:
    # extra_hosts:
    #  - "host.docker.internal:host-gateway"  # Minha rede docker interna vai rodar utilizando a rede da minha máquina / host
    # dns:
    #  - 8.8.8.8 google
    #  - 1.1.1.1 cloudflare
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: alessaleit/pacotesbanho-backend:latest
    container_name: petshop_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_local:5432/${POSTGRES_DB}
      DEBUG: "true"
      LOG_LEVEL: "debug"
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-recanto-minidogs}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres_local:
        condition: service_healthy
      evolution_api:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - petshop_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: alessaleit/pacotesbanho-frontend:latest
    container_name: petshop_frontend
    ports:
      - "80:80"
    environment:
      API_HOST: backend
      NGINX_ENVSUBST_FILTERED_ARGS: '$$API_HOST'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - petshop_network

networks:
  petshop_network:
    driver: bridge

volumes:
  pgdata:
  evolution_instances:
