# Limita tentativas de login por IP (força bruta): 5 req/min, rajada de 5
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# Limite geral da API por IP
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    # Usuários não-root não podem bindar na porta 80, mudamos para 8080
    listen 8080;
    server_name _;
    server_tokens off;

    # Atrás do Caddy (rede Docker): usa o IP real do cliente enviado por ele,
    # senão todo o tráfego pareceria vir de um único IP e o rate limit não valeria.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Painel de contas: mesma proteção do login contra tentativas da chave mestra
    location /api/v1/admin-canil/ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/api/v1/admin-canil/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/v1/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/api/v1/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # A documentação interativa não é exposta ao público
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # add_header em um location sobrescreve os do server; por isso repetimos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
